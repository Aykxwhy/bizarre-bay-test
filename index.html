<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#8745E7">
    <meta name="apple-mobile-web-app-title" content="Gobe-Tout">
    <meta name="application-name" content="Gobe-Tout">
    <title>Gobe-Tout – version de test</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #8745E7; touch-action: none; -webkit-user-select: none; user-select: none;
        overscroll-behavior: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      /* Portrait (docs/REFERENCE-V2.md) : plein écran sur téléphone tenu droit… */
      /* Toucher : aucun geste du navigateur (zoom, défilement, menu d'appui long) sur le jeu. */
      #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #F5CB84;
        touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; outline: none; }
      /* …et colonne 9:16 centrée sur ordinateur ou tablette en paysage. */
      @media (orientation: landscape) and (min-height: 601px) {
        #unity-canvas { inset: auto; top: 50%; left: 50%; transform: translate(-50%, -50%);
          height: 100vh; height: 100dvh; width: 56.25vh; width: 56.25dvh; }
      }
      #chargement { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #fff; font: 700 22px/1.3 system-ui, sans-serif; text-align: center; padding: 0 24px; }
      #barre { width: min(70vw, 420px); height: 14px; border-radius: 7px; background: rgba(255,255,255,.3); overflow: hidden; }
      #barre > div { height: 100%; width: 0; background: #F5CB84; transition: width .2s; }
      #tourner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #8745E7; color: #fff; font: 700 22px/1.4 system-ui, sans-serif; text-align: center; padding: 24px; z-index: 10; }
      /* Téléphone tenu en paysage (écran bas) : on demande de le remettre droit. */
      @media (orientation: landscape) and (max-height: 600px) { #tourner { display: flex; } }
      #erreur { color: #fff; font: 16px system-ui, sans-serif; max-width: 80vw; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="chargement"><div>Gobe-Tout</div><div id="barre"><div></div></div><div id="erreur"></div></div>
    <div id="tourner">Tiens ton téléphone<br>droit, en mode portrait 📱↻</div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      // Safari iOS ignore « user-scalable=no » : on bloque nous-mêmes le pincement, le double toucher qui zoome
      // et le défilement de la page. Les écouteurs sont sur le document, après ceux de Unity sur le canvas :
      // le jeu reçoit toujours les touchers.
      ["gesturestart", "gesturechange", "gestureend", "dblclick"].forEach(function (t) {
        document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
      });
      document.addEventListener("touchmove", function (e) { if (e.touches.length > 1 || e.target !== canvas) e.preventDefault(); }, { passive: false });
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      var config = {
        dataUrl: "Build/Web.data.unityweb",
        frameworkUrl: "Build/Web.framework.js.unityweb",
        codeUrl: "Build/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Bizarre Bay",
        productName: "Gobe-Tout",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };
      var script = document.createElement("script");
      script.src = "Build/Web.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#barre > div").style.width = (100 * p) + "%";
        }).then(function () {
          document.querySelector("#chargement").style.display = "none";
        }).catch(function (message) {
          document.querySelector("#erreur").textContent = "Le jeu n'a pas pu démarrer : " + message;
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
