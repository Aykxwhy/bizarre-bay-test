<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ECEDF0">
<title>Bizarre Bay – Bocaux</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #ECEDF0; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    font-family: Fredoka, system-ui, sans-serif; }
  #jeu { display: block; margin: 0 auto; touch-action: none; }
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: rgba(40, 30, 70, .45); z-index: 5; }
  .ov.cache { display: none; }
  .carte { background: #fff; border: 4px solid #8745E7; border-radius: 26px; padding: 16px 18px 14px;
    width: min(320px, 86vw); text-align: center; box-shadow: 0 10px 0 rgba(60, 20, 110, .25);
    animation: pop .38s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0 } to { transform: scale(1); opacity: 1 } }
  .carte h1 { margin: 4px 0 2px; color: #8745E7; font-size: 32px; letter-spacing: .5px; }
  .carte p { margin: 4px 0 10px; color: #5b5568; font-size: 17px; }
  .carte img.glouton { height: 120px; margin: -2px 0 0; }
  .etoiles { font-size: 40px; margin: 2px 0 6px; }
  .etoiles span { display: inline-block; animation: pop .4s cubic-bezier(.2, 1.8, .4, 1) both; }
  .etoiles span.off { filter: grayscale(1); opacity: .35; }
  .btn { display: block; width: 100%; margin: 9px 0 0; padding: 13px 10px; border: 0; border-radius: 16px;
    font: 700 20px Fredoka, system-ui, sans-serif; color: #fff; background: #4CB944; box-shadow: 0 5px 0 #2f8a2a;
    cursor: pointer; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #2f8a2a; }
  .btn.violet { background: #8745E7; box-shadow: 0 5px 0 #5a2aa5; }
  .btn.bleu { background: #3D8BEB; box-shadow: 0 5px 0 #2a63ad; }
  .btn.gris { background: #b4b7bf; box-shadow: 0 5px 0 #8b8e96; }
  .rang { display: flex; gap: 8px; }
  .rang .btn { font-size: 17px; }
  .liste .btn { text-align: left; font-size: 18px; }
  .liste .btn small { float: right; opacity: .85; font-size: 15px; }
  .aide { color: #5b5568; font-size: 15px; text-align: left; line-height: 1.35; }
</style>
</head>
<body>
<canvas id="jeu"></canvas>
<div id="ov" class="ov cache"><div class="carte" id="carte"></div></div>
<script src="regles.js"></script>
<script>
'use strict';
// ───────────────────────── constantes ─────────────────────────
const NIVEAUX = ['niveau-01.json', 'niveau-02.json', 'niveau-03.json', 'niveau-04.json', 'niveau-05.json', 'niveau-06.json'];
const COUL = { rouge: '#EE4B3F', bleu: '#3D8BEB', jaune: '#F5C02A', vert: '#4CB944', violet: '#9B5DE5', orange: '#F28C28', rose: '#F27BB0', cyan: '#4FC9E3' };
const VIOLET = '#8745E7';
const DIR = Regles.DIRECTIONS;
const ANGLE = { droite: 0, bas: Math.PI / 2, gauche: Math.PI, haut: -Math.PI / 2 };
const ESP = 8.5;            // espacement des mini-créatures le long du chemin (deux files alternées)
const VOIE = 6.5;           // décalage de chaque file par rapport au milieu du chemin
const CHARIOT = 240 / 219;  // hauteur / largeur du sprite bocal-chariot
const COUV = 0.275, VERRE = 0.70; // le couvercle occupe 0–27,5 % du sprite, le verre 27,5–70 %

const cv = document.getElementById('jeu');
const ctx = cv.getContext('2d');
const ov = document.getElementById('ov'), carte = document.getElementById('carte');

// ───────────────────────── outils ─────────────────────────
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const easeIn = t => t * t;
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
let maintenant = 0;
const anims = [];
function anim(dur, f, ease, fin, delai) { anims.push({ t0: maintenant + (delai || 0), dur, f, ease: ease || (t => t), fin }); }
function majAnims() {
  for (let i = anims.length - 1; i >= 0; i--) {
    const a = anims[i];
    if (maintenant < a.t0) continue;
    const t = clamp((maintenant - a.t0) / a.dur, 0, 1);
    a.f(a.ease(t), t);
    if (t >= 1) { anims.splice(i, 1); if (a.fin) a.fin(); }
  }
}
function rr(x, y, w, h, r, c) {
  c = c || ctx;
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function vibre(m) { try { if (navigator.vibrate) navigator.vibrate(m); } catch (e) {} }
function stocker(k, v) { try { localStorage.setItem('bocaux.' + k, JSON.stringify(v)); } catch (e) {} }
function lire(k, d) { try { const v = localStorage.getItem('bocaux.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
const reglages = { son: lire('son', true) };

// ───────────────────────── sons (synthèse, pas de fichier) ─────────────────────────
const Son = (() => {
  let ac = null;
  function ok() {
    if (!reglages.son) return null;
    try { if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { return null; }
    return ac;
  }
  function bip(freq, dur, type, vol, glisse, delai) {
    const a = ok(); if (!a) return;
    const t = a.currentTime + (delai || 0);
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (glisse) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * glisse), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || .2, t + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
  }
  function bruit(dur, vol, f0, f1) {
    const a = ok(); if (!a) return;
    const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(f0, a.currentTime); f.frequency.exponentialRampToValueAtTime(f1, a.currentTime + dur);
    g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start();
  }
  return {
    reveil: ok,
    croque: k => bip(520 * Math.pow(2, Math.min(k, 18) / 12), .09, 'triangle', .22, 1.6),
    whoosh: () => bruit(.22, .5, 600, 2600),
    pose: () => { bip(140, .12, 'sine', .35, .5); bruit(.08, .25, 300, 200); },
    refus: () => { bip(150, .16, 'square', .12, .7); bip(110, .16, 'square', .1, .7, .07); },
    bloc: () => { [660, 830, 990].forEach((f, i) => bip(f, .14, 'triangle', .18, 1, i * .07)); },
    vide: () => bip(900, .1, 'sine', .15, 2.2),
    tension: () => { bip(70, .18, 'sine', .45, .8); bip(70, .18, 'sine', .4, .8, .22); },
    aimant: () => bip(300, .5, 'sawtooth', .07, 3),
    piment: () => { bruit(.4, .6, 400, 4000); bip(220, .35, 'sawtooth', .08, 2.5); },
    place: () => [523, 784].forEach((f, i) => bip(f, .16, 'triangle', .2, 1, i * .08)),
    defile: () => { for (let i = 0; i < 8; i++) bip(700 + i * 40, .04, 'triangle', .06, 1, i * .09); },
    victoire: () => [523, 659, 784, 1047].forEach((f, i) => bip(f, .22, 'triangle', .22, 1, i * .11)),
    rot: () => { bip(95, .55, 'sawtooth', .22, .6); bip(140, .4, 'square', .06, .5, .05); },
    defaite: () => [392, 370, 349, 262].forEach((f, i) => bip(f, .3, 'triangle', .2, .97, i * .22)),
  };
})();

// ───────────────────────── images ─────────────────────────
const IMG = {};
function charger(nom) {
  return new Promise(r => { const i = new Image(); i.onload = () => { IMG[nom] = i; r(); }; i.onerror = () => r(); i.src = 'assets/' + nom + '.png'; });
}

// Bocal-chariot, préparé une fois : base (chariot + verre à 35 %), reflets du verre, couvercle teinté par couleur.
const BOCAL = {};
function preparerBocal() {
  const im = IMG['bocal-chariot']; if (!im) return;
  const w = im.width, h = im.height;
  const toile = () => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
  const base = toile(), b = base.getContext('2d');
  b.save(); b.beginPath(); b.rect(0, h * VERRE, w, h); b.clip(); b.drawImage(im, 0, 0); b.restore();
  b.save(); b.beginPath(); b.rect(0, h * COUV, w, h * (VERRE - COUV)); b.clip(); b.globalAlpha = .35; b.drawImage(im, 0, 0); b.restore();
  BOCAL.base = base;
  const ref = toile(), r = ref.getContext('2d');
  try {
    r.drawImage(im, 0, 0);
    const d = r.getImageData(0, 0, w, h), p = d.data;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const dansVerre = y > h * COUV && y < h * VERRE;
      const lum = (p[i] + p[i + 1] + p[i + 2]) / 3, sat = Math.max(p[i], p[i + 1], p[i + 2]) - Math.min(p[i], p[i + 1], p[i + 2]);
      const a = dansVerre ? clamp((lum - 190) / 50, 0, 1) * clamp(1 - sat / 70, 0, 1) * p[i + 3] / 255 : 0;
      p[i] = p[i + 1] = p[i + 2] = 255; p[i + 3] = Math.round(a * 230);
    }
    r.putImageData(d, 0, 0);
  } catch (e) { r.clearRect(0, 0, w, h); }
  BOCAL.reflet = ref;
  BOCAL.couvercle = {};
  for (const [nom, c] of Object.entries(COUL)) {
    const cc = toile(), k = cc.getContext('2d');
    k.save(); k.beginPath(); k.rect(0, 0, w, h * COUV); k.clip(); k.drawImage(im, 0, 0); k.restore();
    // teinte vive qui garde le modelé du couvercle crème
    k.globalCompositeOperation = 'color'; k.fillStyle = c; k.fillRect(0, 0, w, h * COUV);
    k.globalCompositeOperation = 'multiply'; k.fillStyle = hexA(c, .85); k.fillRect(0, 0, w, h * COUV);
    k.globalCompositeOperation = 'destination-in';
    k.save(); k.beginPath(); k.rect(0, 0, w, h * COUV); k.clip(); k.drawImage(im, 0, 0); k.restore();
    BOCAL.couvercle[nom] = cc;
  }
}

// ───────────────────────── mise en page (largeur logique 390) ─────────────────────────
let H = 844, echelle = 1, dpr = 1;
const L = {};
function redimensionner() {
  const cw = Math.min(innerWidth, 520);
  echelle = cw / 390;
  H = Math.max(700, innerHeight / echelle);
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  cv.style.width = cw + 'px'; cv.style.height = (H * echelle) + 'px';
  cv.width = Math.round(cw * dpr); cv.height = Math.round(H * echelle * dpr);
  L.chemin = { y: 54, h: clamp(H * .29, 200, 262) };
  L.bande = { y: L.chemin.y + L.chemin.h + 10, h: 84 };
  L.boost = H - 84;
  L.plateauHaut = L.bande.y + L.bande.h + 18;
  L.plateauBas = L.boost - 8;
  if (P) { placerGrille(); placerBanc(); construireChemin(); }
}
function placerGrille() {
  const s = P.m, dispoH = L.plateauBas - L.plateauHaut;
  L.case = Math.min(372 / s.largeur, dispoH / (s.hauteur + .2), 92);
  L.gx = (390 - L.case * s.largeur) / 2;
  L.gy = L.plateauHaut + (dispoH - L.case * (s.hauteur + .2)) / 2 + L.case * .2;
  for (const b of s.bocaux) if (b.v.mode === 'plateau') { const c = centreCase(b.x, b.y); b.v.x = c[0]; b.v.y = c[1]; }
}
const centreCase = (x, y) => [L.gx + (x + .5) * L.case, L.gy + (y + .5) * L.case];
function boiteGlouton() {
  const h = L.bande.h + 34, w = h * .86;
  return { x: 195 - w / 2, y: L.bande.y + L.bande.h - h + 6, w, h };
}
function placerBanc() {
  const n = P.m.banc.length, g = boiteGlouton();
  const gauche = 3, droite = n - 3;
  const cote = (390 - 16 - g.w - 12) / 2;
  L.place = Math.min(50, (cote - (Math.max(gauche, droite) - 1) * 5) / Math.max(gauche, droite));
  L.places = [];
  for (let i = 0; i < gauche; i++) L.places.push(g.x - 6 - (gauche - 1 - i) * (L.place + 5) - L.place / 2);
  for (let j = 0; j < droite; j++) L.places.push(g.x + g.w + 6 + j * (L.place + 5) + L.place / 2);
}
const centrePlace = p => [L.places[p], L.bande.y + L.bande.h / 2 + 3];
function bouche() {
  const g = boiteGlouton(), k = P ? P.ventre : 1;
  return { x: g.x + g.w * .5, y: g.y + g.h - g.h * .64 * k };
}

// Chemin : spirale en piste de stade qui part du bas, au-dessus du Glouton, et s'enroule vers l'intérieur.
let chemin = [];
function construireChemin() {
  const cx = 195, cy = L.chemin.y + L.chemin.h / 2, A = 182, R = L.chemin.h / 2 - 16, PAS = 31;
  const stade = (u, retrait) => {
    const a = A - retrait, r = Math.max(8, R - retrait), ls = Math.max(0, 2 * (a - r));
    const per = 2 * ls + 2 * Math.PI * r;
    let d = (u % 1) * per;
    if (d < ls / 2) return [cx - d, cy + r];
    d -= ls / 2;
    if (d < Math.PI * r) { const t = Math.PI / 2 + d / r; return [cx - ls / 2 + r * Math.cos(t), cy + r * Math.sin(t)]; }
    d -= Math.PI * r;
    if (d < ls) return [cx - ls / 2 + d, cy - r];
    d -= ls;
    if (d < Math.PI * r) { const t = -Math.PI / 2 + d / r; return [cx + ls / 2 + r * Math.cos(t), cy + r * Math.sin(t)]; }
    d -= Math.PI * r;
    return [cx + ls / 2 - d, cy + r];
  };
  const tours = Math.max(1, (R - 16) / PAS);
  const bruts = [];
  for (let u = 0; u <= tours; u += 1 / 2400) bruts.push(stade(u, PAS * u));
  // rééchantillonnage au pixel, avec la normale pour les deux files
  const pts = [bruts[0]];
  let reste = 0;
  for (let i = 1; i < bruts.length; i++) {
    const [x0, y0] = bruts[i - 1], [x1, y1] = bruts[i];
    const d = Math.hypot(x1 - x0, y1 - y0);
    reste += d;
    while (reste >= 1) { reste -= 1; const t = 1 - reste / d; pts.push([lerp(x0, x1, t), lerp(y0, y1, t)]); }
  }
  chemin = pts.map((p, i) => {
    const a = pts[Math.max(0, i - 3)], b = pts[Math.min(pts.length - 1, i + 3)];
    const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.hypot(dx, dy) || 1;
    return [p[0], p[1], -dy / n, dx / n];
  });
}
const pointChemin = s => chemin[clamp(Math.round(s), 0, chemin.length - 1)];

// ───────────────────────── partie ─────────────────────────
let P = null;
let niveauxCharges = [];
let numNiveau = lire('niveau', 0);

async function chargerNiveaux() {
  const l = await Promise.all(NIVEAUX.map(f => fetch('levels/' + f).then(r => r.json()).catch(() => null)));
  niveauxCharges = l.filter(Boolean).map(Regles.normaliser);
}

function demarrer(i) {
  numNiveau = clamp(i, 0, niveauxCharges.length - 1);
  stocker('niveau', numNiveau);
  const niv = niveauxCharges[numNiveau];
  const m = Regles.creer(niv);
  for (const b of m.bocaux) b.v = { mode: 'plateau', x: 0, y: 0, s: 1, r: 0, sx: 1, sy: 1, tremble: 0, flash: 0, n: b.n, a: 1, pop: 0 };
  anims.length = 0;
  P = {
    niv, m,
    aff: m.fringale.map(b => ({ couleur: b.couleur, n: b.n })), // la foule affichée (au rythme des bouchées)
    teteAff: 0, decal: 0, arrivee: 1, defileJoue: false,
    vols: [], parts: [], textes: [],
    mangeChrono: 0, combo: 0, comboChrono: 0, comboSrc: null,
    croque: 0, ventre: 1, totalCreatures: m.fringale.reduce((a, b) => a + b.n, 0), mangees: 0,
    expression: 'faim', exprChrono: 0,
    fini: false, perduChrono: 0, tension: false,
    piment: false, boostersUtilises: 0, tremblementBanc: 0, boostTremble: [0, 0, 0, 0],
    tuto: niv.tier === 'tutoriel', touches: 0, intro: 1,
  };
  ferme();
  placerGrille(); placerBanc(); construireChemin();
  P.longueurFoule = P.totalCreatures * ESP;
  Son.reveil();
}

// ───────────────────────── actions du joueur ─────────────────────────
function toucherBocal(id) {
  const m = P.m, b = m.bocaux[id];
  if (P.piment) {
    if (Regles.placeLibre(m) === -1) return refusBanc();
    Regles.sortir(m, id, true);
    P.piment = false; m.boosters.piment--; P.boostersUtilises++; m.boostersUtilises++;
    b.arrive = false;
    Son.piment(); vibre([20, 30, 40]);
    sortieAnimee(b, true);
    return;
  }
  const bl = Regles.bloqueur(m, id);
  if (bl !== -1) return refus(b, m.bocaux[bl]);
  if (Regles.placeLibre(m) === -1) return refusBanc(b);
  Regles.sortir(m, id);
  b.arrive = false;
  P.touches++;
  Son.whoosh(); vibre(8);
  sortieAnimee(b, false);
}
function refus(b, bl) { b.v.tremble = 1; bl.v.flash = 1; Son.refus(); vibre([25, 30, 25]); }
function refusBanc(b) {
  if (b) b.v.tremble = 1;
  P.tremblementBanc = 1;
  Son.refus(); vibre([40, 30, 40]);
  texte('Banc plein !', 195, L.bande.y - 4, '#EE4B3F', 24);
}

function sortieAnimee(b, piment) {
  const v = b.v; v.mode = 'vol';
  const x0 = v.x, y0 = v.y;
  const [dx, dy] = DIR[b.fleche];
  let ex = x0, ey = y0, duree1 = 0;
  if (!piment) {
    const cases = dx > 0 ? P.m.largeur - b.x : dx < 0 ? b.x + 1 : dy > 0 ? P.m.hauteur - b.y : b.y + 1;
    ex = x0 + dx * (cases + .15) * L.case; ey = y0 + dy * (cases + .15) * L.case;
    duree1 = 60 + cases * 38;
  }
  const allerAuBanc = () => {
    const xa = v.x, ya = v.y, s0 = v.s;
    anim(piment ? 520 : 420, t => {
      const [xb, yb] = centrePlace(b.place);
      const cx = (xa + xb) / 2, cy = Math.min(ya, yb) - (piment ? 150 : 60);
      v.x = (1 - t) * (1 - t) * xa + 2 * (1 - t) * t * cx + t * t * xb;
      v.y = (1 - t) * (1 - t) * ya + 2 * (1 - t) * t * cy + t * t * yb;
      v.r = Math.sin(t * Math.PI) * .35 * (xb < xa ? -1 : 1); // il roule en penchant
      v.s = lerp(s0, tailleBanc() / L.case, t);
      if (piment && Math.random() < .8) particule(v.x, v.y + 10, ['#ff5a1f', '#ffb21f', '#ffe14d'][Math.floor(Math.random() * 3)], 'feu');
    }, easeInOut, () => atterrir(b));
  };
  if (piment) anim(160, t => { v.s = 1 + .25 * Math.sin(t * Math.PI); v.y = y0 - 14 * Math.sin(t * Math.PI); }, null, allerAuBanc);
  else anim(duree1, t => { v.x = lerp(x0, ex, t); v.y = lerp(y0, ey, t); v.r = .12 * Math.sin(t * 20) * t; }, easeIn, () => { v.r = 0; allerAuBanc(); });
}
const tailleBanc = () => L.place * 1.08;

function atterrir(b) {
  const v = b.v;
  v.mode = 'banc'; v.r = 0; b.arrive = true;
  const [x, y] = centrePlace(b.place); v.x = x; v.y = y; v.s = tailleBanc() / L.case;
  anim(380, t => { const k = Math.exp(-6 * t) * Math.cos(14 * t); v.sy = 1 - .3 * k; v.sx = 1 + .22 * k; }, null, () => { v.sx = v.sy = 1; });
  for (let i = 0; i < 6; i++) particule(x + (Math.random() - .5) * 30, y + L.place * .45, '#c9ccd3', 'poussiere');
  Son.pose(); vibre(12);
  P.mangeChrono = Math.min(P.mangeChrono, 60);
}

function boosterAimant() {
  const m = P.m;
  if (m.boosters.aimant <= 0 || P.fini) return refusBooster(0);
  if (!Regles.boosterPermis(m)) return refusBooster(0, true);
  const prises = Regles.aimant(m);
  if (!prises.length) { texte('Rien à aimanter', 195, L.plateauHaut, VIOLET, 20); return refusBooster(0); }
  m.boosters.aimant--; P.boostersUtilises++; m.boostersUtilises++;
  Son.aimant(); vibre([10, 20, 10, 20, 10]);
  P.aimantChrono = 1;
  prises.forEach((ev, i) => {
    const b = m.bocaux[ev.bocal];
    setTimeout(() => {
      b.v.n--; b.v.pop = 1;
      lancerCreature(b.couleur, b.v.x, b.v.y - L.case * .2, 520, 'aimant');
      if (ev.vide) setTimeout(() => envolerBocal(b), 120);
    }, i * 75);
  });
}
function boosterPiment() {
  if (P.m.boosters.piment <= 0 || P.fini) return refusBooster(1);
  if (!Regles.boosterPermis(P.m)) return refusBooster(1, true);
  P.piment = !P.piment;
  if (P.piment) { texte('Touche un bocal bloqué !', 195, L.plateauHaut - 4, '#ff5a1f', 20); vibre(10); }
}
function boosterPlace() {
  const m = P.m;
  if (m.boosters.place <= 0 || P.fini) return refusBooster(2);
  if (!Regles.boosterPermis(m)) return refusBooster(2, true);
  if (!Regles.placeEnPlus(m)) return refusBooster(2);
  m.boosters.place--; P.boostersUtilises++; m.boostersUtilises++;
  placerBanc();
  Son.place(); vibre([10, 30, 10]);
  const [x, y] = centrePlace(m.banc.length - 1);
  for (let i = 0; i < 14; i++) particule(x, y, i % 2 ? '#F5C02A' : '#fff', 'etincelle');
  texte('+1 place !', x, y - 44, '#F5A623', 24);
}
function boutique() { texte('Boutique : pas dans ce test', 195, L.boost - 16, VIOLET, 17); P.boostTremble[3] = 1; }
function refusBooster(i, max) {
  if (max) texte(Regles.BOOSTERS_MAX + ' boosters au plus par partie', 195, L.boost - 16, VIOLET, 17);
  P.boostTremble[i] = 1; Son.refus(); vibre(30);
}

// ───────────────────────── manger ─────────────────────────
function lancerCreature(couleur, x0, y0, duree, src) {
  P.vols.push({ couleur, x0, y0, src, t: 0, d: duree || 380, rot: (Math.random() - .5) * 5 });
}
function majManger(dt) {
  const m = P.m;
  P.mangeChrono -= dt;
  if (P.mangeChrono > 0) return;
  const ev = Regles.mangerUn(m);
  if (!ev) { P.mangeChrono = 0; return; }
  const b = m.bocaux[ev.bocal];
  b.v.n--; b.v.pop = 1; b.v.sy = .86;
  anim(160, t => { b.v.sy = lerp(.86, 1, easeBack(t)); });
  lancerCreature(b.couleur, b.v.x, b.v.y - L.place * .35, 380, b.id);
  if (ev.vide) setTimeout(() => envolerBocal(b), 140);
  P.mangeChrono = P.combo > 8 ? 60 : 80;
}
// Le bocal vide s'envole.
function envolerBocal(b) {
  const v = b.v; v.mode = 'envol';
  const y0 = v.y, s0 = v.s;
  anim(420, t => { v.y = y0 - 70 * easeOut(t); v.s = s0 * (1 - .3 * t); v.a = 1 - t; v.r = .5 * t; }, null, () => { v.mode = 'parti'; });
  for (let i = 0; i < 10; i++) particule(v.x, v.y, i % 3 ? COUL[b.couleur] : '#fff', 'etincelle');
  Son.vide();
}
function finCombo() {
  const bo = bouche();
  if (P.combo >= 2) texte('+' + P.combo + ' Miam !', bo.x, bo.y - 54, P.combo >= 10 ? '#EE4B3F' : P.combo >= 6 ? '#F28C28' : VIOLET, Math.min(40, 22 + P.combo * 1.2), 1300);
  P.combo = 0;
}
function bouchee(couleur, src) {
  const a = P.aff[P.teteAff];
  if (!a) return;
  if (P.combo && src !== P.comboSrc) finCombo();
  P.comboSrc = src;
  a.n--; P.mangees++;
  P.decal = ESP; P.croque = 1;
  P.combo++; P.comboChrono = 380;
  P.expression = 'mastication'; P.exprChrono = 170;
  const b = bouche();
  for (let i = 0; i < 4; i++) particule(b.x, b.y, COUL[couleur], 'miette');
  Son.croque(P.combo); vibre(5);
  if (a.n <= 0) {
    P.teteAff++;
    for (let i = 0; i < 22; i++) particule(b.x, b.y - 10, i % 2 ? COUL[couleur] : '#fff', 'confetti');
    if (P.teteAff < P.aff.length) { Son.bloc(); vibre([15, 40, 15]); }
  }
}

// ───────────────────────── effets ─────────────────────────
function particule(x, y, c, type) {
  const a = Math.random() * Math.PI * 2, v = type === 'confetti' ? 2 + Math.random() * 5 : type === 'feu' ? .6 : type === 'poussiere' ? 1 + Math.random() * 1.5 : 1.5 + Math.random() * 3.5;
  P.parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (type === 'confetti' ? 3 : type === 'feu' ? 1.5 : 1), c, type, vie: 1, taille: type === 'confetti' ? 4 + Math.random() * 3 : type === 'feu' ? 6 + Math.random() * 6 : 2.5 + Math.random() * 2.5, rot: Math.random() * 6 });
}
function texte(t, x, y, c, taille, duree) { P.textes.push({ t, x, y, c, taille: taille || 22, vie: 0, d: duree || 1100 }); }

// ───────────────────────── boucle ─────────────────────────
let avant = 0;
function boucle(t) {
  const dt = Math.min(50, t - (avant || t)); avant = t; maintenant = t;
  if (P) { majAnims(); maj(dt); dessiner(); }
  requestAnimationFrame(boucle);
}

function maj(dt) {
  const m = P.m;
  // arrivée de la foule : elle défile le long du chemin jusqu'à sa place
  if (P.arrivee > 0) {
    P.arrivee = Math.max(0, P.arrivee - dt / 1500);
    if (!P.defileJoue) { P.defileJoue = true; Son.defile(); }
  }
  const pret = P.arrivee <= 0;
  if (!P.fini && pret) majManger(dt);
  for (let i = P.vols.length - 1; i >= 0; i--) {
    const f = P.vols[i];
    f.t += dt;
    if (f.t >= f.d) { P.vols.splice(i, 1); bouchee(f.couleur, f.src); }
  }
  if (P.comboChrono > 0) { P.comboChrono -= dt; if (P.comboChrono <= 0) finCombo(); }
  P.decal = Math.max(0, P.decal - dt * .07);
  P.croque = Math.max(0, P.croque - dt / 160);
  P.intro = Math.max(0, P.intro - dt / 1700);
  P.tremblementBanc = Math.max(0, P.tremblementBanc - dt / 400);
  if (P.aimantChrono) P.aimantChrono = Math.max(0, P.aimantChrono - dt / 900);
  P.boostTremble = P.boostTremble.map(v => Math.max(0, v - dt / 350));
  const cible = 1 + .1 * (P.mangees / P.totalCreatures);
  P.ventre += (cible - P.ventre) * Math.min(1, dt / 300);
  if (P.exprChrono > 0) { P.exprChrono -= dt; if (P.exprChrono <= 0 && !P.fini) P.expression = 'faim'; }
  for (const b of m.bocaux) {
    const v = b.v;
    v.tremble = Math.max(0, v.tremble - dt / 380);
    v.flash = Math.max(0, v.flash - dt / 500);
    v.pop = Math.max(0, v.pop - dt / 180);
    if (v.mode === 'banc') {
      const [x, y] = centrePlace(b.place), k = Math.min(1, dt / 90);
      v.x += (x - v.x) * k; v.y += (y - v.y) * k; v.s += (tailleBanc() / L.case - v.s) * k;
    }
  }
  for (let i = P.parts.length - 1; i >= 0; i--) {
    const p = P.parts[i];
    p.x += p.vx * dt / 16; p.y += p.vy * dt / 16;
    p.vy += (p.type === 'feu' ? -.05 : p.type === 'confetti' ? .18 : .12) * dt / 16;
    p.vx *= .98; p.rot += .2;
    p.vie -= dt / (p.type === 'confetti' ? 1400 : p.type === 'feu' ? 420 : 600);
    if (p.vie <= 0) P.parts.splice(i, 1);
  }
  for (let i = P.textes.length - 1; i >= 0; i--) { const tx = P.textes[i]; tx.vie += dt; if (tx.vie >= tx.d) P.textes.splice(i, 1); }

  // tension du banc
  const libres = m.banc.filter(x => x === null).length;
  const tension = !P.fini && libres <= 1 && m.bocaux.some(b => b.etat === 'plateau');
  if (tension && !P.tension) { Son.tension(); vibre([30, 60, 30]); }
  P.tension = tension;
  if (tension && P.exprChrono <= 0 && !P.fini) P.expression = 'grimace';
  else if (!tension && P.expression === 'grimace' && !P.fini) P.expression = 'faim';

  if (P.fini || !pret) return;
  if (P.teteAff >= P.aff.length && !P.vols.length) return victoire();
  const raison = Regles.perdu(m);
  if (raison && !P.vols.length) { P.perduChrono += dt; if (P.perduChrono > 650) defaite(raison); }
  else P.perduChrono = 0;
}

// ───────────────────────── dessin ─────────────────────────
function dessiner() {
  ctx.setTransform(dpr * echelle, 0, 0, dpr * echelle, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#F3F4F6'); g.addColorStop(1, '#E3E5E9');
  ctx.fillStyle = g; ctx.fillRect(0, 0, 390, H);
  dessinerChemin();
  dessinerBande();
  dessinerPlateau();
  dessinerBoosters();
  dessinerHaut();
  for (const b of P.m.bocaux) if (b.v.mode === 'vol' || b.v.mode === 'envol') dessinerBocal(b, false);
  dessinerVols();
  dessinerParticules();
  dessinerTextes();
  if (P.intro > 0) dessinerIntro();
}

function dessinerChemin() {
  if (!chemin.length) return;
  // la piste : bord, fond, liseré clair
  const trace = (larg, coul) => {
    ctx.strokeStyle = coul; ctx.lineWidth = larg; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    for (let s = 0; s < chemin.length; s += 4) { const [x, y] = chemin[s]; if (s === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); }
    const [xf, yf] = chemin[chemin.length - 1]; ctx.lineTo(xf, yf);
    ctx.stroke();
  };
  ctx.save(); ctx.translate(0, 3); trace(32, 'rgba(120,125,140,.18)'); ctx.restore();
  trace(31, '#C9CCD3');
  trace(26, '#DCDEE3');
  // la foule : des mini-créatures en deux files, par blocs de couleur
  const arr = easeOut(1 - P.arrivee);
  const avance = (1 - arr) * (chemin.length + P.longueurFoule * .15);
  const foule = [];
  let i = 0, debordement = 0;
  const debuts = [];
  for (let j = P.teteAff; j < P.aff.length; j++) {
    const bl = P.aff[j];
    for (let k = 0; k < bl.n; k++) {
      const s = i * ESP + P.decal + avance;
      if (s < chemin.length - 4) { foule.push([s, bl.couleur, i]); if (k === 0) debuts.push([s, j]); }
      else debordement++;
      i++;
    }
  }
  const taille = 19;
  for (let n = foule.length - 1; n >= 0; n--) {
    const [s, c, idx] = foule[n];
    const [x, y, nx, ny] = pointChemin(s);
    const cote = idx % 2 ? 1 : -1;
    const marche = P.arrivee > 0 || P.decal > 0 ? Math.abs(Math.sin(maintenant / 70 + idx)) * 2.5 : 0;
    const tete = n === 0 ? 1 + .12 * Math.sin(maintenant / 110) : 1;
    const px = x + nx * VOIE * cote, py = y + ny * VOIE * cote - marche;
    const im = IMG['creature-' + c];
    if (im) {
      const h = taille * tete, w = h * im.width / im.height;
      ctx.drawImage(im, px - w / 2, py - h * .62, w, h);
    } else { ctx.fillStyle = COUL[c]; ctx.beginPath(); ctx.arc(px, py, 5, 0, 7); ctx.fill(); }
  }
  // nombre de chaque bloc
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const [s, j] of debuts) {
    const [x, y] = pointChemin(s);
    const txt = String(P.aff[j].n), tete = j === P.teteAff;
    ctx.font = `700 ${tete ? 15 : 11}px Fredoka, system-ui`;
    const w = ctx.measureText(txt).width + (tete ? 14 : 10), h = tete ? 20 : 15;
    const by = y - (tete ? 26 : 22);
    ctx.fillStyle = tete ? COUL[P.aff[j].couleur] : '#fff'; rr(x - w / 2, by - h / 2, w, h, h / 2); ctx.fill();
    ctx.strokeStyle = tete ? '#fff' : COUL[P.aff[j].couleur]; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = tete ? '#fff' : '#3d3a48'; ctx.fillText(txt, x, by + 1);
  }
  if (debordement > 0) {
    const [x, y] = chemin[chemin.length - 1];
    ctx.font = '700 13px Fredoka, system-ui'; ctx.fillStyle = VIOLET; ctx.fillText('+' + debordement, x, y - 16);
  }
}

function dessinerBande() {
  const m = P.m, b = L.bande;
  const tremble = P.tremblementBanc > 0 ? Math.sin(maintenant / 25) * 5 * P.tremblementBanc : 0;
  const pouls = (Math.sin(maintenant / 140) + 1) / 2;
  ctx.save(); ctx.translate(tremble, 0);
  // bande grise
  ctx.fillStyle = 'rgba(120,125,140,.18)'; rr(4, b.y + 5, 382, b.h, 20); ctx.fill();
  ctx.fillStyle = P.tension ? `rgb(${226 + 20 * pouls},${208 - 40 * pouls},${210 - 40 * pouls})` : '#D3D6DC';
  rr(4, b.y, 382, b.h, 20); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.45)'; rr(4, b.y, 382, 5, 3); ctx.fill();
  // places du banc
  const n = m.banc.length;
  for (let p = 0; p < n; p++) {
    const [x, y] = centrePlace(p), t = L.place;
    ctx.fillStyle = 'rgba(0,0,0,.08)'; rr(x - t / 2, y - t / 2 + 3, t, t, 11); ctx.fill();
    rr(x - t / 2, y - t / 2, t, t, 11);
    ctx.fillStyle = m.banc[p] === null && P.tension ? `rgba(255,205,200,${.7 + .3 * pouls})` : '#BFC3CA'; ctx.fill();
    ctx.lineWidth = p === 0 ? 3.5 : 3;
    ctx.strokeStyle = P.tension ? `rgba(225,45,35,${.6 + .4 * pouls})` : p === 0 ? '#F5C02A' : '#EEF0F3';
    ctx.stroke();
  }
  if (P.tension && m.banc.filter(x => x === null).length === 1) {
    ctx.fillStyle = '#E0352B'; ctx.font = '700 14px Fredoka, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Dernière place !', 195, b.y + b.h + 9);
  }
  dessinerGlouton();
  for (const bo of m.bocaux) if (bo.v.mode === 'banc') dessinerBocal(bo, false);
  ctx.restore();
}

function dessinerGlouton() {
  const g = boiteGlouton();
  const nom = 'glouton-' + P.expression;
  const img = IMG[nom] || IMG['glouton-faim'];
  const k = P.ventre * (1 + .07 * Math.sin(P.croque * Math.PI));
  const respire = 1 + .015 * Math.sin(maintenant / 380);
  const cx = g.x + g.w / 2, bas = g.y + g.h;
  ctx.fillStyle = 'rgba(80,80,100,.18)';
  ctx.beginPath(); ctx.ellipse(cx, bas - 3, g.w * .36 * k, 6, 0, 0, Math.PI * 2); ctx.fill();
  if (img) {
    const h = g.h * k * respire, w = h * img.width / img.height;
    const dx = P.expression === 'grimace' ? Math.sin(maintenant / 30) * 1.2 : 0;
    ctx.drawImage(img, cx - w / 2 + dx, bas - h, w, h);
    // ventre transparent qui s'éclaire à chaque bouchée
    const c = P.aff[P.teteAff] ? COUL[P.aff[P.teteAff].couleur] : '#fff';
    const vy = bas - h * .3, rx = w * .3 * (1 + .05 * P.croque), ry = h * .14;
    const gr = ctx.createRadialGradient(cx, vy, 2, cx, vy, rx);
    gr.addColorStop(0, hexA(c, .12 + .35 * P.croque)); gr.addColorStop(1, hexA(c, 0));
    ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(cx, vy, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
  }
  if (P.aimantChrono > 0 && IMG['booster-aimant']) {
    const b = bouche(), im = IMG['booster-aimant'];
    ctx.globalAlpha = Math.min(1, P.aimantChrono * 3);
    ctx.drawImage(im, b.x + 30 + Math.sin(maintenant / 50) * 2, b.y - 50, 34, 34);
    ctx.globalAlpha = 1;
  }
}

function dessinerPlateau() {
  const s = P.m;
  const libres = new Set(Regles.sortiesPossibles(s));
  const liste = s.bocaux.filter(b => b.v.mode === 'plateau').sort((a, b) => a.y - b.y || a.x - b.x);
  for (const b of liste) dessinerBocal(b, true);
  // tutoriel : une main sur un bocal qui peut sortir
  if (P.tuto && P.arrivee <= 0 && P.intro <= 0 && !P.fini) {
    const c = Regles.couleurTete(s);
    const l = [...libres];
    const id = P.touches === 0 ? (l.find(i => s.bocaux[i].couleur === c) ?? l[0]) : undefined;
    if (id !== undefined) {
      const v = s.bocaux[id].v, d = Math.abs(Math.sin(maintenant / 260)) * 10;
      ctx.strokeStyle = `rgba(238,75,63,${.5 - .4 * Math.abs(Math.sin(maintenant / 260))})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(v.x, v.y + L.case * .42, L.case * .45 * (1 + .3 * Math.abs(Math.sin(maintenant / 260))), L.case * .13, 0, 0, 7); ctx.stroke();
      ctx.font = '46px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('👆', v.x + 18, v.y + L.case * .55 + d);
    }
    ctx.fillStyle = '#5b5568'; ctx.font = '600 16px Fredoka, system-ui'; ctx.textAlign = 'center';
    const t = P.touches === 0 ? 'Touche un bocal dont la flèche est libre' : 'Le bocal bloqué attend qu\'on libère sa flèche';
    ctx.fillText(t, 195, L.plateauBas - 18);
  }
}

// Bocal-chariot : base (chariot + verre), mini-créatures derrière le verre, reflets, couvercle teinté, flèche, nombre.
function dessinerBocal(b, surPlateau) {
  const v = b.v;
  const w = L.case * .98 * v.s, h = w * CHARIOT;
  ctx.save();
  let tx = v.x, ty = v.y;
  if (v.tremble > 0) tx += Math.sin(maintenant / 22) * 6 * v.tremble;
  if (P.piment && surPlateau && Regles.bloqueur(P.m, b.id) !== -1) ty += Math.sin(maintenant / 60 + b.id) * 1.5;
  // le point (x, y) est le centre de la case ; le chariot repose sur le bas de la case
  const pied = ty + w * .48;
  ctx.translate(tx, pied);
  ctx.rotate(v.r);
  ctx.scale(v.sx, v.sy);
  ctx.globalAlpha = v.a;
  const x0 = -w / 2, y0 = -h;
  if (v.mode !== 'vol' && v.mode !== 'envol') { ctx.fillStyle = 'rgba(70,75,95,.18)'; ctx.beginPath(); ctx.ellipse(0, -h * .02, w * .44, w * .07, 0, 0, Math.PI * 2); ctx.fill(); }
  if (BOCAL.base) ctx.drawImage(BOCAL.base, x0, y0, w, h);
  // mini-créatures (5 au plus) en deux rangées derrière le verre
  const im = IMG['creature-' + b.couleur];
  const n = Math.min(5, v.n);
  if (im && n > 0) {
    const places = [[.41, .47], [.6, .47], [.3, .6], [.5, .62], [.7, .6]];
    const ordre = n >= 3 ? [2, 3, 4, 0, 1].slice(0, n) : [3, 4].slice(0, n);
    const hc = h * .21, wc = hc * im.width / im.height;
    for (const p of [0, 1, 2, 3, 4]) {
      if (!ordre.includes(p)) continue;
      const [px, py] = places[p];
      ctx.drawImage(im, x0 + w * px - wc / 2, y0 + h * py - hc / 2, wc, hc);
    }
  }
  if (BOCAL.reflet) ctx.drawImage(BOCAL.reflet, x0, y0, w, h);
  const couv = BOCAL.couvercle && BOCAL.couvercle[b.couleur];
  if (couv) ctx.drawImage(couv, x0, y0, w, h);
  // flash rouge du bocal qui bloque
  if (v.flash > 0) {
    ctx.strokeStyle = hexA('#E0352B', v.flash); ctx.lineWidth = 4;
    ctx.beginPath(); ctx.ellipse(0, y0 + h * .45, w * .52, h * .5, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // flèche blanche sur le couvercle
  if (surPlateau || (v.mode === 'vol' && !b.arrive && v.s > .8)) {
    ctx.save();
    ctx.translate(0, y0 + h * .17);
    ctx.scale(1, .78);
    ctx.rotate(ANGLE[b.fleche]);
    const a = w * .17;
    ctx.fillStyle = P.piment && surPlateau ? '#FFE14D' : '#fff';
    ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
    ctx.beginPath(); ctx.moveTo(a * 1.05, 0); ctx.lineTo(a * .05, -a * .85); ctx.lineTo(a * .05, -a * .34); ctx.lineTo(-a * 1.0, -a * .34);
    ctx.lineTo(-a * 1.0, a * .34); ctx.lineTo(a * .05, a * .34); ctx.lineTo(a * .05, a * .85); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  // nombre de créatures
  const k = 1 + .4 * v.pop, r = w * .15 * k;
  const cx = w * .33, cy = y0 + h * .66;
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = Math.max(1.5, w * .03); ctx.strokeStyle = COUL[b.couleur]; ctx.stroke();
  ctx.fillStyle = '#3d3a48'; ctx.font = `700 ${Math.round(w * .19 * k)}px Fredoka, system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(v.n, cx, cy + 1);
  ctx.restore();
}

const BOOSTERS = [
  { nom: 'aimant', label: 'Aimant', x: 62, f: () => boosterAimant() },
  { nom: 'piment', label: 'Piment', x: 151, f: () => boosterPiment() },
  { nom: 'place', label: '+1 place', x: 240, f: () => boosterPlace() },
  { nom: 'boutique', label: 'Boutique', x: 328, f: () => boutique() },
];
function dessinerBoosters() {
  BOOSTERS.forEach((bo, i) => {
    const stock = bo.nom === 'boutique' ? null : P.m.boosters[bo.nom];
    const actif = bo.nom === 'piment' && P.piment;
    const verrou = stock === 0 && P.niv.tier === 'tutoriel';
    const y = L.boost + 36;
    const tr = Math.sin(maintenant / 25) * 5 * P.boostTremble[i];
    ctx.save(); ctx.translate(bo.x + tr, y);
    ctx.globalAlpha = stock === null || (stock > 0 && Regles.boosterPermis(P.m)) ? 1 : .5;
    if (actif) { ctx.fillStyle = `rgba(255,120,30,${.4 + .3 * Math.sin(maintenant / 90)})`; ctx.beginPath(); ctx.arc(0, 0, 37, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.beginPath(); ctx.arc(0, 3, 29, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.fill();
    ctx.lineWidth = 3.5; ctx.strokeStyle = actif ? '#ff5a1f' : '#3D8BEB'; ctx.stroke();
    if (verrou) {
      ctx.font = '26px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🔒', 0, 1);
    } else {
      const im = IMG[bo.nom === 'boutique' ? 'piece' : 'booster-' + bo.nom];
      if (im) { const s = bo.nom === 'boutique' ? 34 : 40, w = s * im.width / im.height; ctx.drawImage(im, -w / 2, -s / 2, w, s); }
    }
    if (stock !== null && !verrou) {
      ctx.fillStyle = stock > 0 ? '#4CB944' : '#9a9da6';
      ctx.beginPath(); ctx.arc(21, 19, 10, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = '700 12px Fredoka, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(stock, 21, 20);
    }
    ctx.fillStyle = '#6a6578'; ctx.font = '600 11px Fredoka, system-ui'; ctx.textAlign = 'center';
    ctx.fillText(bo.label, 0, 41);
    ctx.restore();
  });
}

function dessinerHaut() {
  const t = 'Niveau ' + (numNiveau + 1);
  ctx.font = '700 20px Fredoka, system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(t).width + 46;
  ctx.fillStyle = 'rgba(80,40,140,.25)'; rr(195 - w / 2, 9, w, 36, 18); ctx.fill();
  ctx.fillStyle = VIOLET; rr(195 - w / 2, 6, w, 36, 18); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillText(t + ' ▾', 195, 25);
  [[28, '↻'], [362, reglages.son ? '🔊' : '🔇']].forEach(([x, e]) => {
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.beginPath(); ctx.arc(x, 27, 19, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, 24, 19, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3D8BEB'; ctx.font = e === '↻' ? '700 22px system-ui' : '16px system-ui'; ctx.fillText(e, x, 25);
  });
}

function dessinerVols() {
  const bo = bouche();
  for (const f of P.vols) {
    const t = easeInOut(clamp(f.t / f.d, 0, 1));
    const cx = (f.x0 + bo.x) / 2, cy = Math.min(f.y0, bo.y) - 70;
    const x = (1 - t) * (1 - t) * f.x0 + 2 * (1 - t) * t * cx + t * t * bo.x;
    const y = (1 - t) * (1 - t) * f.y0 + 2 * (1 - t) * t * cy + t * t * bo.y;
    const k = t < .7 ? lerp(.6, 1, t / .7) : lerp(1, .4, (t - .7) / .3);
    const img = IMG['creature-' + f.couleur];
    ctx.fillStyle = hexA(COUL[f.couleur], .22);
    ctx.beginPath(); ctx.arc(x, y + 5, 9 * k, 0, Math.PI * 2); ctx.fill();
    if (img) { const h = 30 * k, w = h * img.width / img.height; ctx.save(); ctx.translate(x, y); ctx.rotate(f.rot * t); ctx.drawImage(img, -w / 2, -h / 2, w, h); ctx.restore(); }
  }
}

function dessinerParticules() {
  for (const p of P.parts) {
    ctx.globalAlpha = Math.max(0, p.vie);
    ctx.fillStyle = p.c;
    if (p.type === 'confetti') { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.taille / 2, -p.taille / 4, p.taille, p.taille / 2); ctx.restore(); }
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.taille * (p.type === 'feu' ? p.vie : 1), 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function dessinerTextes() {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const tx of P.textes) {
    const t = tx.vie / tx.d;
    const k = t < .15 ? easeBack(t / .15) : 1;
    ctx.globalAlpha = t > .7 ? 1 - (t - .7) / .3 : 1;
    ctx.save(); ctx.translate(clamp(tx.x, 80, 310), tx.y - 30 * t); ctx.scale(k, k);
    ctx.font = `700 ${tx.taille}px Fredoka, system-ui`;
    ctx.lineWidth = 6; ctx.strokeStyle = '#fff'; ctx.strokeText(tx.t, 0, 0);
    ctx.fillStyle = tx.c; ctx.fillText(tx.t, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function dessinerIntro() {
  const a = P.intro > .8 ? (1 - P.intro) * 5 : Math.min(1, P.intro * 2.5);
  ctx.globalAlpha = a;
  const y = L.plateauHaut + 40;
  ctx.fillStyle = 'rgba(70,35,130,.72)'; rr(30, y, 330, 86, 22); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff'; ctx.font = '700 30px Fredoka, system-ui';
  ctx.fillText('Niveau ' + (numNiveau + 1), 195, y + 30);
  ctx.font = '600 17px Fredoka, system-ui'; ctx.fillStyle = '#FFE08A';
  const dur = P.niv.tier === 'tres_difficile' ? '  ·  Très difficile' : P.niv.tier === 'difficile' ? '  ·  Difficile' : '';
  ctx.fillText(P.niv.nom + dur, 195, y + 62);
  ctx.globalAlpha = 1;
}

// ───────────────────────── fin de partie ─────────────────────────
function victoire() {
  P.fini = true;
  P.expression = 'rot';
  Son.rot(); vibre([40, 40, 80]);
  const b = bouche();
  texte('BURP !', b.x, b.y - 60, VIOLET, 38, 1400);
  for (let i = 0; i < 70; i++) setTimeout(() => particule(40 + Math.random() * 310, L.chemin.y + 30, ['#EE4B3F', '#3D8BEB', '#F5C02A', '#4CB944', '#9B5DE5', '#F27BB0'][i % 6], 'confetti'), i * 12);
  setTimeout(() => Son.victoire(), 700);
  const etoiles = P.boostersUtilises === 0 ? 3 : P.boostersUtilises <= 1 ? 2 : 1;
  const fait = lire('etoiles', {}); fait[numNiveau] = Math.max(fait[numNiveau] || 0, etoiles); stocker('etoiles', fait);
  setTimeout(() => {
    const suivant = numNiveau + 1 < niveauxCharges.length;
    montre(`<img class="glouton" src="assets/glouton-rot.png" alt="">
      <h1>BRAVO !</h1>
      <div class="etoiles">${[0, 1, 2].map(i => `<span class="${i < etoiles ? '' : 'off'}" style="animation-delay:${.15 + i * .2}s">⭐</span>`).join('')}</div>
      <p>${P.totalCreatures} créatures avalées${P.boostersUtilises ? ` · ${P.boostersUtilises} booster${P.boostersUtilises > 1 ? 's' : ''}` : ' · sans booster'}</p>
      ${suivant ? '<button class="btn" data-a="suivant">Niveau suivant</button>' : '<p><b>Tous les niveaux sont finis !</b></p>'}
      <button class="btn violet" data-a="rejouer">Rejouer</button>`);
  }, 1500);
}

function defaite(raison) {
  P.fini = true;
  P.expression = 'grimace';
  P.tremblementBanc = 1.5;
  Son.defaite(); vibre([80, 50, 80, 50, 150]);
  const restant = P.aff.slice(P.teteAff).reduce((a, b) => a + b.n, 0);
  setTimeout(() => {
    const bo = P.m.boosters, permis = Regles.boosterPermis(P.m);
    const secours = [];
    if (permis && raison === 'banc' && bo.place > 0) secours.push(`<button class="btn bleu" data-a="place">+1 place <small>(${bo.place})</small></button>`);
    if (permis && bo.aimant > 0 && P.m.bocaux.some(b => b.etat === 'plateau' && b.couleur === Regles.couleurTete(P.m))) secours.push(`<button class="btn bleu" data-a="aimant">Aimant <small>(${bo.aimant})</small></button>`);
    montre(`<img class="glouton" src="assets/glouton-grimace.png" alt="">
      <h1>${raison === 'banc' ? 'Le banc est plein !' : 'Plus aucun coup !'}</h1>
      <p>Il restait <b>${restant}</b> créature${restant > 1 ? 's' : ''} à manger.</p>
      ${secours.length ? `<p style="margin-bottom:0">Continuer avec un booster :</p><div class="rang">${secours.join('')}</div>` : ''}
      <button class="btn" data-a="rejouer">Rejouer</button>`);
  }, 900);
}

function montre(html) { carte.innerHTML = html; ov.classList.remove('cache'); }
function ferme() { ov.classList.add('cache'); }

ov.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const act = a.dataset.a;
  Son.reveil();
  if (act === 'suivant') demarrer(numNiveau + 1);
  else if (act === 'rejouer') demarrer(numNiveau);
  else if (act === 'niveau') demarrer(+a.dataset.n);
  else if (act === 'fermer') ferme();
  else if (act === 'place' || act === 'aimant') {
    ferme(); P.fini = false; P.perduChrono = -400; P.expression = 'faim';
    if (act === 'place') boosterPlace(); else boosterAimant();
  }
});

function menuNiveaux() {
  const et = lire('etoiles', {});
  montre(`<h1>Bocaux</h1>
    <p class="aide">Touche un bocal : il sort si rien ne gêne dans le sens de sa flèche, et roule jusqu'au banc. Le Glouton mange les créatures de la couleur en tête de la foule. Banc plein = perdu !</p>
    <div class="liste">${niveauxCharges.map((n, i) => `<button class="btn ${i === numNiveau ? 'violet' : 'bleu'}" data-a="niveau" data-n="${i}">${i + 1}. ${n.nom}<small>${n.bocaux.length} bocaux ${et[i] ? '⭐'.repeat(et[i]) : ''}</small></button>`).join('')}</div>
    <button class="btn gris" data-a="fermer">Fermer</button>`);
}

// ───────────────────────── toucher ─────────────────────────
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (!P) return;
  Son.reveil();
  const r = cv.getBoundingClientRect();
  const x = (e.clientX - r.left) / echelle, y = (e.clientY - r.top) / echelle;
  if (y < 50) {
    if (x < 54) return demarrer(numNiveau);
    if (x > 336) { reglages.son = !reglages.son; stocker('son', reglages.son); return; }
    if (x > 110 && x < 280) return menuNiveaux();
    return;
  }
  if (P.fini) return;
  if (y > L.boost - 4) {
    for (const bo of BOOSTERS) if (Math.abs(x - bo.x) < 42) return bo.f();
    return;
  }
  if (P.arrivee > 0) return; // la foule arrive encore
  const cx = Math.floor((x - L.gx) / L.case), cy = Math.floor((y - L.gy) / L.case);
  if (cx >= 0 && cy >= 0 && cx < P.m.largeur && cy < P.m.hauteur) {
    const id = P.m.grille[cy][cx];
    if (id !== -1) return toucherBocal(id);
  }
  if (P.piment && y > L.plateauHaut) P.piment = false;
});
addEventListener('resize', redimensionner);

// ───────────────────────── lancement ─────────────────────────
(async function () {
  redimensionner();
  const noms = ['glouton-faim', 'glouton-mastication', 'glouton-rot', 'glouton-grimace', 'bocal-chariot', 'piece',
    'booster-aimant', 'booster-piment', 'booster-place', ...Object.keys(COUL).map(c => 'creature-' + c)];
  await Promise.all([chargerNiveaux(), ...noms.map(charger), document.fonts ? document.fonts.load('700 20px Fredoka').catch(() => {}) : 0]);
  preparerBocal();
  const q = new URLSearchParams(location.search).get('niveau');
  demarrer(q ? +q - 1 : numNiveau);
  requestAnimationFrame(boucle);
})();
</script>
